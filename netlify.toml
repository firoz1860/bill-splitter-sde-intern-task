[build]
  command = "pnpm install && pnpm --filter bill-splitter-web build"
  publish = "web/dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/*"
  to = "https://bill-splitter-api.YOUR-SUBDOMAIN.workers.dev/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200